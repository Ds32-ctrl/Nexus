<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Sistema de Alto Rendimiento</title>
    <!-- Enlace al CSS según tu estructura -->
    <link rel="stylesheet" href="src/css/style.css">
    <!-- Tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Fondo Animado -->
    <div class="animated-background"></div>

    <!-- Navegación -->
    <header class="navbar glass">
        <div class="logo">NEXUS</div>
        <nav>
            <a href="#features">Pilares</a>
            <a href="#about">Filosofía</a>
            <button id="btnLogin" class="btn-primary">Acceder</button>
        </nav>
    </header>

    <!-- Hero Section -->
    <main class="hero">
        <div class="hero-content fade-in">
            <h1>Domina tu <span>Atención</span></h1>
            <p>Estrategias de Deep Work, control financiero y micro resoluciones en un único ecosistema digital diseñado para el alto rendimiento.</p>
            <button id="btnStart" class="btn-glow">Iniciar Evolución</button>
        </div>
    </main>

    <!-- Modal de Login (Ventana Flotante) -->
    <div id="loginModal" class="modal-overlay hidden">
        <div class="modal-content glass fade-in-up">
            <button id="closeModal" class="close-btn">&times;</button>
            <h2>Bienvenido a Nexus</h2>
            <p class="subtitle">Ingresa a tu entorno de trabajo</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary full-width">Desbloquear Sesión</button>
            </form>
            <div class="modal-footer">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>

    <!-- Scripts según tu estructura -->
    <script src="src/js/main.js"></script>
    <script src="src/js/auth.js"></script>
</body>
</html>
