<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Sistema de Alto Rendimiento</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --surface-color: #1a1d24;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .action-card {
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
            margin-bottom: 1rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background-color: transparent;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-badge">
            <span class="status-dot"></span> Entorno Restringido
        </div>
        
        <h1>Domina tu tiempo.<br>Construye tu futuro.</h1>
        <p class="subtitle">Tu espacio personal de alto rendimiento. Sin ruido, sin distracciones. Solo métricas, ejecución y conocimiento.</p>

        <div class="action-card">
            <!-- Próximo paso: Aquí integraremos el Login de Supabase/Firebase -->
            <button class="btn" onclick="iniciarSesion()">Acceder al Dashboard</button>
            <button class="btn btn-outline" onclick="verDocumentacion()">Leer Documentación</button>
        </div>

        <div class="footer-note">
            Arquitectura de desarrollo personal. Encriptado y sincronizado.
        </div>
    </div>

    <script>
        // Lógica inicial para preparar las siguientes fases
        function iniciarSesion() {
            alert("Fase 2: Aquí conectaremos la API de autenticación para validar tu acceso seguro.");
        }

        function verDocumentacion() {
            alert("Aquí podrás agregar tus notas técnicas, resúmenes y el 'Diario de Síntesis'.");
        }
    </script>
</body>
</html>
