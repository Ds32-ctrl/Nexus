<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OS | Command Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white bg-[#050505]">
    
    <div class="bg-glow"></div>

    <div class="min-h-screen flex">
        
        <!-- SIDEBAR -->
        <aside class="w-20 lg:w-64 glass border-r border-white/5 flex flex-col justify-between h-screen sticky top-0 z-40 transition-all duration-300">
            <div>
                <!-- Logo -->
                <div class="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b border-white/5">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 shrink-0">
                        <i class="ph-bold ph-infinity text-white text-xl"></i>
                    </div>
                    <span class="hidden lg:block font-bold text-xl tracking-tight text-white ml-3">Nexus<span class="text-indigo-400">OS</span></span>
                </div>
                
                <!-- Navegación -->
                <nav class="mt-6 px-2 lg:px-4 space-y-1">
                    <p class="hidden lg:block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 px-3">Módulos Activos</p>
                    <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 group transition-all">
                        <i class="ph-fill ph-squares-four text-xl group-hover:scale-110 transition-transform"></i>
                        <span class="hidden lg:block font-medium">Command Center</span>
                    </a>
                    <a href="deep-work.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all group">
                        <i class="ph ph-timer text-xl group-hover:scale-110 transition-transform"></i>
                        <span class="hidden lg:block font-medium">Deep Work</span>
                    </a>
                    <!-- ... Otros enlaces ... -->
                </nav>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-10">
            
            <!-- Header -->
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-white tracking-tight">Bienvenido de nuevo</h1>
                    <p id="current-date" class="text-gray-400 text-sm mt-1 flex items-center gap-2">
                        <i class="ph ph-calendar-blank"></i> Cargando fecha...
                    </p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 border border-white/10 flex items-center justify-center overflow-hidden cursor-pointer">
                        <span class="text-white font-bold text-sm">DC</span>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                
                <!-- 1. Deep Work Widget -->
                <div class="glass-card rounded-3xl p-6 md:col-span-2 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl -mt-10 -mr-10"></div>
                    
                    <div class="flex justify-between items-start mb-6">
                        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                            <i class="ph-fill ph-timer text-indigo-400"></i> Estado de Flujo
                        </h2>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row items-center gap-8">
                        <div class="relative w-36 h-36 flex items-center justify-center shrink-0">
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6" />
                                <circle id="timer-circle" cx="50" cy="50" r="45" fill="none" stroke="#6366f1" stroke-width="6" stroke-dasharray="283" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-1000" />
                            </svg>
                            <div class="absolute flex flex-col items-center">
                                <span id="timer-display" class="text-3xl font-bold text-white tracking-tighter">45:00</span>
                                <span class="text-[10px] uppercase tracking-widest text-gray-400 mt-1">Enfoque</span>
                            </div>
                        </div>
                        
                        <div class="flex-1 w-full space-y-3">
                            <div class="flex gap-2 mt-4">
                                <button id="btn-start-timer" class="flex-1 py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold transition-all">
                                    Iniciar
                                </button>
                                <button id="btn-stop-timer" class="px-4 py-2.5 rounded-xl glass hover:bg-white/5 text-gray-300 transition-colors">
                                    <i class="ph-bold ph-stop"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Control Financiero (Sin cambios estructurales JS) -->
                <!-- ... -->

                <!-- 3. Micro Resoluciones -->
                <div class="glass-card rounded-3xl p-6 md:col-span-2 lg:col-span-3 xl:col-span-4">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                            <i class="ph-fill ph-check-square-offset text-purple-400"></i> Micro Resoluciones Diarias
                        </h2>
                        <span id="progress-text" class="text-sm text-gray-400">Progreso: 0%</span>
                    </div>
                    
                    <div class="w-full h-1.5 bg-white/5 rounded-full mb-6 overflow-hidden">
                        <div id="progress-bar" class="h-full bg-gradient-to-r from-purple-500 to-indigo-500 rounded-full w-0 transition-all duration-500"></div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                        <label class="cursor-pointer group flex items-start gap-3 p-4 rounded-2xl bg-white/5 border border-white/5 transition-all">
                            <input type="checkbox" class="task-checkbox mt-1 w-5 h-5 rounded border-gray-600 bg-gray-700 text-purple-500 focus:ring-purple-500">
                            <div>
                                <p class="task-title text-sm font-medium text-white group-hover:text-purple-300 transition-colors">Revisar finanzas en Excel</p>
                            </div>
                        </label>
                        <!-- Más tareas iguales -->
                    </div>
                </div>

                <!-- 4. Registro Diario / Estado de Ánimo -->
                <div class="glass-card rounded-3xl p-6 md:col-span-2 xl:col-span-2">
                    <h2 class="text-lg font-semibold text-white flex items-center gap-2 mb-4">
                        <i class="ph-fill ph-notebook text-pink-400"></i> Registro Diario
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-gray-400 mb-2">¿Cómo te sientes hoy?</p>
                            <div class="flex gap-2">
                                <button class="mood-btn w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center transition-all text-xl grayscale hover:grayscale-0" data-mood="happy" aria-label="Feliz">😄</button>
                                <button class="mood-btn w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center transition-all text-xl grayscale hover:grayscale-0" data-mood="good" aria-label="Bien">🙂</button>
                                <button class="mood-btn w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center transition-all text-xl grayscale hover:grayscale-0" data-mood="neutral" aria-label="Neutral">😐</button>
                                <button class="mood-btn w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center transition-all text-xl grayscale hover:grayscale-0" data-mood="tired" aria-label="Cansado">😫</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts con type="module" -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
