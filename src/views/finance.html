<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OS | Inteligencia Financiera</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-white bg-[#050505]">
    
    <div class="bg-glow"></div>

    <div class="h-screen flex">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-10 relative flex flex-col h-full custom-scrollbar">
            
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 shrink-0">
                <div>
                    <h1 class="text-3xl font-bold text-white tracking-tight flex items-center gap-3">
                        <i class="ph-fill ph-wallet text-emerald-500"></i> Inteligencia Financiera
                    </h1>
                    <p class="text-gray-400 text-sm mt-1">Motor algorítmico para control, desarrollo y libertad financiera.</p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="btn-export-finance" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white text-sm font-medium transition-colors flex items-center gap-2">
                        <i class="ph ph-download-simple"></i> Exportar Reporte
                    </button>
                    <button id="btn-add-data" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)] flex items-center gap-2">
                        <i class="ph-bold ph-plus"></i> Ingresar Dato
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-0">
                
                <!-- KPI GLOBALES & GRÁFICAS -->
                <div class="lg:col-span-8 flex flex-col gap-6">
                    
                    <!-- 5. PLAN FINANCIERO Y DESARROLLO (Algoritmos) -->
                    <div class="glass-card rounded-3xl p-8 relative overflow-hidden group border border-emerald-500/20">
                        <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl -mt-20 -mr-20 transition-all group-hover:bg-emerald-500/20 pointer-events-none"></div>
                        
                        <div class="flex justify-between items-start mb-6 relative z-10">
                            <div>
                                <p class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-1">Flujo de Caja Libre (Mensual)</p>
                                <h2 id="kpi-cashflow" class="text-5xl font-bold text-white tracking-tighter">$0</h2>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-1">Tasa de Ahorro</p>
                                <h2 id="kpi-savings-rate" class="text-3xl font-bold text-emerald-400">0.0%</h2>
                            </div>
                        </div>

                        <div id="algorithmic-insights" class="grid grid-cols-3 gap-4 relative z-10">
                            <!-- Inyectado por JS: Insights 50/30/20, Runway, FI Number -->
                        </div>
                    </div>

                    <!-- GRÁFICA DE DISTRIBUCIÓN -->
                    <div class="glass-card rounded-3xl p-6 relative">
                        <h3 class="text-lg font-semibold text-white mb-4">Distribución de Capital</h3>
                        <div class="w-full h-64">
                            <canvas id="financeChart"></canvas>
                        </div>
                    </div>

                    <!-- 1 & 2. LIBRO MAYOR (Ingresos y Gastos) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- INGRESOS -->
                        <div class="glass-card rounded-3xl p-6">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-md font-semibold text-white flex items-center gap-2">
                                    <i class="ph-bold ph-arrow-down-left text-emerald-400"></i> Ingresos
                                </h3>
                                <span id="total-income-lbl" class="text-sm font-bold text-emerald-400">$0</span>
                            </div>
                            <div id="incomes-container" class="space-y-2"></div>
                        </div>
                        
                        <!-- GASTOS -->
                        <div class="glass-card rounded-3xl p-6">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-md font-semibold text-white flex items-center gap-2">
                                    <i class="ph-bold ph-arrow-up-right text-red-400"></i> Costos
                                </h3>
                                <span id="total-expense-lbl" class="text-sm font-bold text-red-400">$0</span>
                            </div>
                            <div id="expenses-container" class="space-y-2"></div>
                        </div>
                    </div>

                </div>

                <!-- COLUMNA LATERAL: METAS Y HORARIO -->
                <div class="lg:col-span-4 flex flex-col gap-6">
                    
                    <!-- 3. OBJETIVOS Y PROYECTOS -->
                    <div class="glass-card rounded-3xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-md font-semibold text-white flex items-center gap-2">
                                <i class="ph-fill ph-target text-blue-400"></i> Proyectos & Metas
                            </h3>
                        </div>
                        <div id="goals-container" class="space-y-4"></div>
                    </div>

                    <!-- 4. PROGRAMACIÓN SEMANAL -->
                    <div class="glass-card rounded-3xl p-6 flex-1">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-md font-semibold text-white flex items-center gap-2">
                                <i class="ph-fill ph-clock text-orange-400"></i> Horario Productivo
                            </h3>
                        </div>
                        <div id="schedule-container" class="space-y-3"></div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="../js/modules/sidebar.js"></script>
    <script type="module" src="../js/modules/finance_engine.js"></script>
</body>
</html>
