<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Comandancia Suprema</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">NEXUS <span class="status-dot pulse" style="margin-left: 8px;"></span></div>
        <div class="nav-actions">
            <span class="brand-badge" style="margin-bottom: 0; margin-right: 15px; border-color: var(--primary-color); color: var(--primary-color);">ADMINISTRADOR</span>
            <button class="btn-icon" id="logoutBtn" aria-label="Cerrar sesión">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </nav>

    <main class="dashboard-container fade-in">
        <header class="dashboard-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 2rem;">
            <div>
                <h1>Comandancia <span class="gradient-text">Nexus</span></h1>
                <p class="subtitle" style="margin-bottom: 0;">Centro de control de accesos y telemetría de red.</p>
            </div>
            <div class="metrics">
                <div class="metric-card">
                    <span class="metric-value" id="metricTotal">0</span>
                    <span class="metric-label">Operadores Activos</span>
                </div>
                <div class="metric-card">
                    <span class="metric-value" id="metricPending" style="color: #f59e0b;">0</span>
                    <span class="metric-label">Solicitudes</span>
                </div>
            </div>
        </header>

        <section class="admin-grid">
            <div class="admin-card">
                <h3 style="color: #f59e0b; margin-bottom: 1.5rem;">Solicitudes Pendientes</h3>
                <div id="pendingList" class="user-list">
                    <p class="text-muted">Analizando base de datos...</p>
                </div>
            </div>
            
            <div class="admin-card">
                <h3 style="color: var(--primary-color); margin-bottom: 1.5rem;">Directorio de Operadores</h3>
                <div id="activeList" class="user-list">
                    <p class="text-muted">Analizando base de datos...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
